version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github_actions"
    # Security updates stay immediate and ungrouped. Version majors are also
    # ungrouped (one dependency per PR) and labelled by the companion workflow.
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
    # Security updates stay immediate and ungrouped. Version majors are also
    # ungrouped (one dependency per PR) and labelled by the companion workflow.
    groups:
      production-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-and-patch:
        applies-to: "version-updates"
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # eslint-config-next 16.3.8 predates Next's ESLint 10 compatibility
      # patches. Revisit with Next/config >=16.4 after lint, install and CI are
      # clean against the then-current TypeScript toolchain.
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0 <11.0.0"
      # Next 16.4 can build with TypeScript 7, but its bundled
      # typescript-eslint 8.71.x declares TypeScript <6.1. Revisit when that
      # peer range officially includes 7 and npm ci is warning-free.
      - dependency-name: "typescript"
        versions:
          - ">=7.0.0 <8.0.0"
      # Tailwind 4 changes the PostCSS plugin and CSS/config model. Revisit when
      # FAIVR schedules that migration and its visual regression review.
      - dependency-name: "tailwindcss"
        versions:
          - ">=4.0.0"
